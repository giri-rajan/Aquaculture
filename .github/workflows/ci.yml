name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Lint and test (backend + fish-health model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Lint
        run: uvx ruff check .
      - name: Install
        run: |
          uv venv .venv
          uv pip install -r Aquaculture_Webapp/backend/requirements.txt
      - name: Fish-health model tests
        working-directory: Aquaculture_Model
        run: ../.venv/bin/python -m pytest -q
      - name: Backend tests (simulator, no Gemini calls)
        working-directory: Aquaculture_Webapp/backend
        run: ../../.venv/bin/python -m pytest -q

  frontend:
    name: Lint, type-check and build (dashboard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Aquaculture_Webapp/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Aquaculture_Webapp/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
